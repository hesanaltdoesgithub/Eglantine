name: Android Eglantine APK

on:
  push:
    branches: [nx2-android]
    paths-ignore:
      - '.github/workflows/release-binaries.yml'
      - '.github/workflows/linux-arm64.yml'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: eglantine-android
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      NDK_VERSION: 28.2.13676358
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 5G
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell /usr/local/lib/node_modules
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile
          sudo fallocate -l 12G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile
          df -h / && free -h

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install NDK and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build glslang-tools ccache
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null
          "$SDKM" "ndk;$NDK_VERSION" "cmake;3.31.5"

      - uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-eglantine-${{ github.sha }}
          restore-keys: ccache-eglantine-

      - name: Build APK (full)
        id: full
        run: |
          chmod +x .ci/android/build.sh
          set -o pipefail
          CCACHE=true .ci/android/build.sh -t standard -b Release -DENABLE_WERROR=OFF 2>&1 | tee build.log

      - uses: actions/cache/save@v4
        if: always() && steps.full.outcome != 'skipped'
        with:
          path: .ccache
          key: ccache-eglantine-${{ github.sha }}

      - name: Report build errors
        if: failure()
        run: |
          free -h; df -h /
          sudo dmesg | grep -iE 'killed process|out of memory' | tail -5 | while read -r l; do echo "::error title=kernel::$l"; done
          grep -E 'error:|e: |FAILED:|BUILD FAILED|Killed|OutOfMemory|No space left' build.log | head -40 | while read -r l; do echo "::error::${l:0:900}"; done
          tail -15 build.log | while read -r l; do echo "::warning title=tail::${l:0:900}"; done

      - uses: actions/upload-artifact@v5
        with:
          name: eglantine-android
          path: artifacts/*.apk
          if-no-files-found: error
